[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
solc_version = "0.8.37"
# Pinned explicitly: newer solc defaults to a later fork; Prague is what Base Sepolia runs.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# Allow-list for vm.readFile / vm.writeJson in scripts.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
# Phase 2 acceptance: at least 10,000 fuzz runs.
runs = 10000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
show_metrics = true

[lint]
# Reviewed and intentional (see docs/SLITHER.md):
#  - block-timestamp: sessions, timelocks, recipient activation and daily caps are time-based by design;
#    validators can skew time by seconds, which none of these depend on.
#  - non-reentrant-not-first: handbook 2.4 orders whenNotPaused before nonReentrant; the pause check is a
#    storage read with no external call, so the order does not affect reentrancy safety.
#  - require-revert-in-loop: a batch must revert as a whole if any item fails (handbook 2.9).
exclude_lints = ["block-timestamp", "non-reentrant-not-first", "require-revert-in-loop"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
base_sepolia = "${VITE_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
