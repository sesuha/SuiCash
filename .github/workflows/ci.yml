name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, red team, build
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs (supply-chain hardening); the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uses the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint, Prettier, forge fmt)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Contract tests (unit, fuzz, invariant)
        run: pnpm test:contracts

      - name: Typed ABIs match the compiled contracts
        run: pnpm abis --check

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Slither (fails on any medium or high finding)
        working-directory: contracts
        run: |
          pip install slither-analyzer==0.11.6
          slither . --fail-medium

      - name: Unit tests
        run: pnpm test

      - name: Red-team suite (policy-only mode)
        run: pnpm redteam

      - name: Production build
        run: pnpm build
